<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COD3HEC — Programming Languages Explained in 10 Minutes</title>
<style>
:root{--bg:#fbf8f1;--ink:#2b2d33;--mute:#8a8d96;--blue:#cfe3ff;--lav:#e1dcff;--mint:#cdf2e1;--coral:#ffd5cc;--yel:#fff0b8;--acc:#7c6cf0}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;height:100vh;overflow:hidden}
#home{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;background:radial-gradient(circle at 20% 20%,var(--lav),transparent 40%),radial-gradient(circle at 85% 80%,var(--mint),transparent 40%)}
#home h1{font-size:clamp(48px,10vw,120px);letter-spacing:-3px}
#home h2{font-weight:400;font-size:clamp(18px,3vw,30px)}
.btn{font:600 15px system-ui,sans-serif;border:0;border-radius:999px;padding:10px 18px;background:var(--ink);color:#fff;cursor:pointer}
.btn.l{background:#fff;color:var(--ink);box-shadow:0 2px 8px #0002}
#pres{display:none;height:100%;flex-direction:column}
#stage{flex:0 0 80%;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:background .6s}
#strip{padding:14px 28px;font-size:clamp(16px,2vw,26px);text-align:center;background:#fff;border-top:1px solid #0001;min-height:64px;display:flex;align-items:center;justify-content:center}
#bar{height:5px;background:#0001}#bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
#ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:8px;font-family:system-ui}
#ctl.h{display:none}
.tag{position:absolute;top:14px;left:20px;font:600 13px system-ui;letter-spacing:2px;color:var(--mute)}
.big{font-size:clamp(40px,8vw,110px);font-weight:700;letter-spacing:-2px}
.sub{font:500 clamp(14px,2vw,24px) system-ui;color:var(--mute);margin-top:8px}
.chip{position:absolute;padding:12px 22px;border-radius:18px;font:700 clamp(18px,3vw,34px) system-ui;box-shadow:0 8px 24px #0002;animation:fly 1s cubic-bezier(.2,1.3,.4,1) both;animation-delay:var(--d,0s)}
@keyframes fly{from{transform:translate(var(--fx),var(--fy)) rotate(40deg) scale(.2);opacity:0}to{transform:translate(var(--tx,0),var(--ty,0)) rotate(0) scale(1);opacity:1}}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes wob{50%{transform:rotate(8deg) scale(1.08)}}
@keyframes grow{from{width:0}}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes orbit{to{transform:rotate(360deg)}}
.pop{animation:pop .7s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--d,0s)}
.rise{animation:rise .7s both;animation-delay:var(--d,0s)}
.row{display:flex;gap:clamp(12px,3vw,40px);align-items:center;justify-content:center;flex-wrap:wrap}
.card{background:#fff;border-radius:22px;padding:22px 28px;box-shadow:0 10px 30px #0002;text-align:center;font:600 clamp(15px,2vw,24px) system-ui}
.code{background:#22252d;color:#e8e8ee;border-radius:16px;padding:20px 26px;font:clamp(14px,2vw,24px)/1.6 Consolas,monospace;min-width:min(520px,90%);box-shadow:0 14px 40px #0004;text-align:left}
.code .o{color:#7ee2a8;margin-top:10px;display:block}
.code input{background:#343842;color:#ffd479;border:0;border-radius:6px;padding:2px 8px;font:inherit;width:7ch}
.tl{width:70%;height:6px;background:#0002;border-radius:3px;position:relative;margin:70px 0 20px}
.tl b{position:absolute;top:-70px;right:0;animation:pop .8s .9s both;font:700 clamp(36px,7vw,90px) system-ui}
.tl i{display:block;height:100%;background:var(--acc);animation:grow 1s both;border-radius:3px}
.cat{font-size:clamp(70px,14vw,180px);animation:wob 1.2s infinite}
.orb{position:absolute;width:min(60vw,60vh);height:min(60vw,60vh);animation:orbit 14s linear infinite}
.orb span{position:absolute;padding:6px 14px;border-radius:14px;font:700 18px system-ui;left:50%;top:0;transform-origin:0 min(30vw,30vh)}
.bar2{height:26px;border-radius:13px;animation:grow 1.4s both;margin:8px 0;color:#fff;font:600 14px system-ui;padding:3px 12px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
@media (max-width:700px){#stage{flex-basis:70%}}
</style></head><body>

<div id="home">
 <div class="sub">CREATED BY ENAYAT</div>
 <h1>COD3HEC</h1>
 <h2>Programming Languages Explained in 10 Minutes</h2>
 <div class="row"><button class="btn" id="go">Enter Presenter Mode</button></div>
 <div class="sub" id="hcount"></div>
</div>

<div id="pres">
 <div id="stage"><div class="tag" id="tag"></div><div id="scene" class="row" style="flex-direction:column;width:100%"></div></div>
 <div id="bar"><i id="prog"></i></div>
 <div id="strip"></div>
 <div id="ctl">
  <button class="btn l" data-a="prev">◀ Prev</button>
  <button class="btn" data-a="next">Next ▶</button>
  <button class="btn l" data-a="play">Play / Pause</button>
  <button class="btn l" data-a="replay">Replay (R)</button>
  <button class="btn l" data-a="mode" id="mode">Mode: Manual</button>
  <button class="btn l" data-a="sec">Restart section</button>
  <button class="btn l" data-a="fs">Fullscreen (F)</button>
  <button class="btn l" data-a="hide">Hide (H)</button>
  <button class="btn l" data-a="exit">Exit</button>
 </div>
</div>

<script>
const COL={Hook:'#f3f0ff',Python:'#eef5ff'};
/* ============ SCENE LIBRARY (reusable, parameterised) ============ */
const R=(a,b)=>a+Math.random()*(b-a);
const FROM=[[-900,0],[900,0],[0,-600],[0,600],[-700,-500],[700,500]];
function chips(list,o={}){ // language chips flying in from different directions
  return list.map(([t,c],i)=>{const f=FROM[i%6],p=o.pos?o.pos[i]:[R(-260,260),R(-120,120)];
   return `<div class="chip" style="background:${c};--fx:${f[0]}px;--fy:${f[1]}px;--tx:${p[0]}px;--ty:${p[1]}px;--d:${i*.15}s">${t}</div>`}).join('');
}
const title=(t,s,c)=>`<div class="pop big" style="color:${c}">${t}</div><div class="sub rise" style="--d:.5s">${s||''}</div>`;
const timeline=(y,l,n,c)=>`<div class="sub">${l}</div><div class="tl"><i style="background:${c}"></i><b style="color:${c}">${y}</b></div><div class="card pop" style="--d:1.2s">${n}</div>`;
const cards=(arr)=>`<div class="row">${arr.map((a,i)=>`<div class="card pop" style="--d:${i*.4}s;background:${a[1]}">${a[0]}</div>`).join('')}</div>`;
function code(lines,out,color){ // typed code window with output
  const L=lines.map((l,i)=>`<div class="rise" style="--d:${i*.5}s">${l}</div>`).join('');
  return `<div class="code" style="border-top:6px solid ${color||'#7c6cf0'}">${L}<span class="o rise" style="--d:${lines.length*.5+.3}s">${out}</span></div>`;
}
/* Interactive Python experiment (simulation — not a real Python interpreter) */
function pyLab(){
  return `<div class="code" style="border-top:6px solid #3776ab"><div>name = "<input id="pn" value="Enayat">"</div><div>print("Hello,", name)</div>
  <button class="btn" style="margin-top:12px" onclick="pyRun()">▶ Run (simulated)</button><span class="o" id="po"></span></div><div class="sub">Simulation: output is produced locally, no Python is running.</div>`;
}
function pyRun(){const v=document.getElementById('pn').value.replace(/[<>&]/g,'');document.getElementById('po').textContent='Hello, '+v}
function dataPipe(){ // messy -> table -> chart
  return `<div class="row"><div class="card pop" style="background:var(--coral)">🌀 messy data<br>3,,x,17,NaN</div><div class="big pop" style="--d:.6s">→</div>
  <div class="card pop" style="--d:1s;background:var(--mint)">clean table<br>3 · 8 · 17</div><div class="big pop" style="--d:1.6s">→</div>
  <div class="card pop" style="--d:2s;background:#fff"><div class="bar2" style="width:60px;background:#3776ab;--d:2.2s"></div><div class="bar2" style="width:120px;background:#f59e0b"></div><div class="bar2" style="width:90px;background:#3776ab"></div></div></div>`;
}
function neural(){
  const L=[3,4,2],xs=[80,260,440];let s='<svg viewBox="0 0 520 280" width="min(640px,90%)">';
  L.forEach((n,i)=>{for(let a=0;a<n;a++)(L[i+1]?[...Array(L[i+1]).keys()]:[]).forEach(b=>{s+=`<line x1="${xs[i]}" y1="${40+a*(200/(n-1||1))}" x2="${xs[i+1]}" y2="${40+b*(200/(L[i+1]-1||1))}" stroke="#3776ab55" stroke-width="2"/>`})});
  L.forEach((n,i)=>{for(let a=0;a<n;a++)s+=`<circle class="pop" style="--d:${i*.4}s;transform-origin:${xs[i]}px ${40+a*(200/(n-1||1))}px" cx="${xs[i]}" cy="${40+a*(200/(n-1||1))}" r="16" fill="${i==2?'#f59e0b':'#3776ab'}"/>`});
  s+=`<circle r="7" fill="#f59e0b"><animateMotion dur="2s" repeatCount="indefinite" path="M80 40 L260 120 L440 80"/></circle></svg>`;
  return s+`<div class="sub">data in → hidden layers → prediction out</div>`;
}
function speed(){
  return `<div style="width:min(620px,88%)"><div class="sub">Execution time (conceptual, not a benchmark)</div>
  <div class="bar2" style="width:90%;background:#3776ab">Python — runs slower</div><div class="bar2" style="width:30%;background:#7c6cf0">C++ — runs faster</div>
  <div class="sub" style="margin-top:20px">Developer time</div>
  <div class="bar2" style="width:30%;background:#3776ab;--d:1s">Python — quick to write</div><div class="bar2" style="width:90%;background:#7c6cf0;--d:1s">C++ — takes longer</div></div>`;
}
function monty(){
  return `<div class="row"><div class="cat" style="animation-name:wob">🐍</div><div class="big pop" style="--d:1.2s">✖</div><div class="cat pop" style="--d:2s">🎭</div></div>
  <div class="big rise" style="--d:2.6s;color:#f59e0b">MONTY PYTHON</div><div class="sub">the comedy show, not the snake</div>`;
}
function universe(){
  const n=[['Python','#cfe3ff'],['Java','#ffd5cc'],['C++','#e1dcff'],['JS','#fff0b8'],['Rust','#ffe0c2'],['Go','#cdf2e1'],['C#','#ece1ff'],['PHP','#f6d6ee']];
  return `<div class="orb">${n.map((x,i)=>`<span style="background:${x[1]};transform:rotate(${i*45}deg) translateX(-50%)">${x[0]}</span>`).join('')}</div><div class="big pop" style="position:relative">🌌</div><div class="sub" style="position:relative">the programming-language universe</div>`;
}
const q=`<div class="big pop" style="font-size:clamp(120px,28vw,320px);color:#7c6cf0;animation-name:pop,wob;animation-duration:.7s,2s;animation-iteration-count:1,infinite">?</div>`;

/* ============ STORYBOARD (data-driven) ============
   [section, exact narration, auto-duration ms, scene HTML builder] */
const HOOK='Hook',PY='Python';
const B=[
[HOOK,'Python, Java, C++, JavaScript, Rust, Go...',5000,()=>chips([['Python','#cfe3ff'],['Java','#ffd5cc'],['C++','#e1dcff'],['JavaScript','#fff0b8'],['Rust','#ffe0c2'],['Go','#cdf2e1']])],
[HOOK,'Bhai, programming seekhne jaoge toh itni saari languages dekhkar ek hi question aata hai — aakhir seekhein toh seekhein kya?',6000,()=>q+`<div class="sub rise" style="--d:.6s">aakhir seekhein toh seekhein kya?</div>`],
[HOOK,'Kya Python se AI banta hai? Java se apps? C++ se games?',6000,()=>cards([['🤖 AI<br>Python?','var(--blue)'],['📱 Apps<br>Java?','var(--coral)'],['🎮 Games<br>C++?','var(--lav)']])],
[HOOK,'Aur JavaScript ka Java se koi connection bhi hai ya dono bas naam ke bhai hain?',6000,()=>`<div class="row"><div class="card pop" style="background:var(--coral)">☕ Java<br><small>name tag: Ja…</small></div><div class="big pop" style="--d:.6s">=?</div><div class="card pop" style="--d:.3s;background:var(--yel)">✨ JavaScript<br><small>name tag: Ja…</small></div></div><div class="sub">same-looking names… brothers?</div>`],
[HOOK,'Aur sabse interesting baat — kuch languages computer ko super-fast instructions deti hain, kuch websites chalati hain, aur kuch AI development mein use hoti hain.',7000,()=>cards([['⚡ CPU instructions<br><code>01101001</code>','var(--lav)'],['🌐 Interactive websites','var(--yel)'],['🧠 AI visuals','var(--mint)']])],
[HOOK,'Toh aaj hum programming languages ko boring definitions se nahi, balki unki stories, real-world uses aur interesting facts ke through samjhenge.',7000,()=>cards([['📖 Stories','var(--coral)'],['🌍 Real-world uses','var(--blue)'],['💡 Interesting facts','var(--yel)']])],
[HOOK,'Video ke end tak tumhe clear ho jayega ki kaunsi language kis kaam ke liye bani hai. Chalo shuru karte hain!',6000,universe],

[PY,'Sabse pehle Python.',4000,()=>title('Python','The Friendly Toolkit','#3776ab')],
[PY,'Agar tumne kabhi programming seekhne ka socha hai, toh kisi na kisi ne zaroor kaha hoga — Python se start karo.',6000,()=>`<div class="row"><div class="card pop">🧑‍🎓 "Programming seekhni hai?"</div><div class="card pop" style="--d:.8s;background:var(--yel)">🗣️ "Python se start karo."</div></div>`],
[PY,'Python ko 1991 mein Guido van Rossum ne introduce kiya tha. Unka main goal tha programming ko simple aur readable banana.',7000,()=>timeline('1991','Introduced by Guido van Rossum','Goal: simple &amp; readable','#3776ab')],
[PY,'Baaki languages mein kabhi curly braces, semicolons aur itne symbols hote hain ki lagta hai keyboard par billi dance karke gayi hai.',7000,()=>`<div class="cat">🐈</div><div class="card pop" style="--d:.5s">{ } ; ( ) [ ] ; { } ;;; &lt;&gt;</div><div class="sub">the cat walked on the keyboard</div>`],
[PY,'Lekin Python ka code comparatively simple dikhta hai.',5000,()=>code(['name = "COD3HEC"','print("Hello,", name)'],'Hello, COD3HEC','#3776ab')],
[PY,'Python ki sabse badi strength hai uski libraries.',5000,()=>`<div class="big pop">🧰</div>`+cards([['pandas','var(--blue)'],['NumPy','var(--mint)'],['PyTorch','var(--coral)'],['Django','var(--yel)']])],
[PY,'Library ko simple language mein samjho — kisi ne pehle se ek toolkit bana di hai, ab tumhe har cheez zero se nahi banani.',7000,()=>`<div class="row"><div class="card pop" style="background:var(--coral)">❌ zero se banana</div><div class="big pop" style="--d:.5s">→</div><div class="card pop" style="--d:.9s;background:var(--mint)">✅ ready toolkit use karo</div></div>`],
[PY,'Data analysis karna hai? Pandas aur NumPy.',5000,dataPipe],
[PY,'AI aur Machine Learning? PyTorch aur TensorFlow.',5000,neural],
[PY,'Websites banani hain? Django aur Flask.',5000,()=>`<div class="card" style="width:min(520px,85%)">🌐 blank browser</div><div class="row"><div class="card pop" style="background:var(--mint)">Django path</div><div class="card pop" style="--d:.4s;background:var(--blue)">Flask path</div></div><div class="card pop" style="--d:1s">✅ working website</div>`],
[PY,'Netflix jaise platforms, Instagram aur scientific research mein bhi Python ka use hota hai.',6000,()=>cards([['🎬 Netflix-style platforms','var(--coral)'],['📷 Instagram','var(--lav)'],['🔬 Scientific research','var(--mint)']])],
[PY,'Haan, ek weakness bhi hai. Python generally C++ jaisi languages ke comparison mein slow ho sakti hai.',6000,speed],
[PY,'Lekin iska code likhna fast hai. Matlab execution mein thoda time lag sakta hai, lekin developer ka time bach jata hai.',7000,()=>pyLab()],
[PY,'Aur ek interesting fact — Python ka naam snake se nahi, comedy show Monty Python se inspired tha!',7000,monty],
];

/* ===== JAVASCRIPT + TYPESCRIPT (stage 3b) ===== */
const JS='JavaScript',TS='TypeScript',Y='#e8b800',TB='#2f74c0';
COL.JavaScript='#fffbe0';COL.TypeScript='#e8f2ff';
let jsN=0;
function jsLab(){
  return `<div class="card" style="width:min(560px,92%);text-align:left;background:#fff"><div class="sub" style="margin:0 0 10px">🌐 browser window (educational simulation)</div>
  <div class="row" style="justify-content:flex-start"><button class="btn" style="background:${Y};color:#222" onclick="jsMenu()">☰ Menu</button>
  <button class="btn" onclick="jsCount()">Clicks: <span id="jc">${jsN}</span></button></div>
  <div id="jm" class="rise" style="display:none;margin:10px 0;background:var(--yel);padding:10px;border-radius:12px">Home · About · Contact</div>
  <div style="margin-top:12px"><input id="je" placeholder="your email" style="padding:8px;border-radius:8px;border:1px solid #0003"> <button class="btn l" onclick="jsForm()">Submit</button></div><div id="jr" class="sub"></div></div>`;
}
function jsMenu(){const m=document.getElementById('jm');m.style.display=m.style.display=='none'?'block':'none'}
function jsCount(){document.getElementById('jc').textContent=++jsN}
function jsForm(){const v=document.getElementById('je').value,r=document.getElementById('jr');
  r.textContent=/^\S+@\S+\.\S+$/.test(v)?'✅ Looks good!':'⚠️ Oops — JavaScript caught a mistake: email is invalid';}
const layers=()=>`<div class="row"><div class="card pop" style="background:var(--coral)">🦴 HTML<br><small>structure</small></div><div class="card pop" style="--d:.7s;background:var(--blue)">👕 CSS<br><small>design</small></div><div class="card pop" style="--d:1.4s;background:var(--yel)">⚡ JavaScript<br><small>functionality</small></div></div>`;
function tsLab(){
  return `<div class="code" style="border-top:6px solid ${TB}"><div>let age<span style="color:#7fc1ff">: number</span> = <input id="tv" value="21" oninput="tsCheck()" style="width:9ch"></div>
  <span class="o" id="to">✅ OK — number</span></div><div class="sub">Educational simulation: a tiny type-check, not the real TypeScript compiler.</div>`;
}
function tsCheck(){const v=document.getElementById('tv').value.trim(),o=document.getElementById('to');
  const ok=v!==''&&!isNaN(Number(v));o.style.color=ok?'#7ee2a8':'#ff8f80';
  o.textContent=ok?'✅ OK — number':`⚠️ Type 'string' is not assignable to type 'number'`;}
const tsCmp=()=>`<div class="row" style="align-items:stretch"><div class="code" style="min-width:0;border-top:6px solid ${Y}"><b>JavaScript</b><div>let age = 21;</div><div>age = "twenty";</div><span class="o" style="color:#ffd479">…runs. problem shows up later 😬</span></div>
  <div class="code" style="min-width:0;border-top:6px solid ${TB}"><b>TypeScript</b><div>let age<span style="color:#7fc1ff">: number</span> = 21;</div><div>age = "twenty";</div><span class="o" style="color:#ff8f80">⚠️ type error, caught early</span></div></div>`;
const tsSpell=()=>`<div class="code" style="border-top:6px solid ${TB}"><div>let age: number = <span style="text-decoration:wavy underline #ff6b5a">"twenty"</span></div></div><div class="card pop" style="--d:.8s;background:var(--coral)">📝 like a spell-checker for code</div>`;
const tsJs=()=>`<div class="row"><div class="code" style="min-width:0">let age<span style="color:#7fc1ff">: number</span> = 21;</div><div class="big pop" style="--d:.6s">→</div><div class="code" style="min-width:0;--d:1s" ><div class="rise" style="--d:1s">let age = 21;</div></div></div><div class="sub rise" style="--d:1.4s">types vanish · plain JavaScript runs in browser / runtime</div>`;
B.push(
[JS,'Ab baat karte hain JavaScript ki.',4000,()=>title('JavaScript','The Living Website',Y)],
[JS,'Agar Python AI ki duniya mein popular hai, toh JavaScript web development ki duniya ka superstar hai.',6000,()=>`<div class="row"><div class="card pop" style="background:var(--blue)">🐍 Python<br>AI world</div><div class="card pop" style="--d:.6s;background:var(--yel)">⭐ JavaScript<br>web superstar</div></div>`],
[JS,'Tum kisi website par jaate ho, button click karte ho, menu open hota hai, form tumhari mistake pakad leta hai — in sab interactions mein JavaScript ka important role hota hai.',9000,jsLab],
[JS,'HTML website ka structure banata hai, CSS usko design karta hai, aur JavaScript usmein functionality add karta hai.',7000,layers],
[JS,'Iski origin story bhi interesting hai.',4000,()=>`<div class="big pop">📜</div><div class="sub">origin story</div>`],
[JS,'1995 mein Netscape ko browser ke liye ek scripting language chahiye thi. Brendan Eich ne bahut kam time mein iska initial version develop kiya — lagbhag 10 din mein!',9000,()=>timeline('1995','Netscape needed a browser scripting language','Brendan Eich · ~10 days ⏳',Y)],
[JS,'Aur nahi, JavaScript aur Java same language nahi hain.',5000,()=>`<div class="row"><div class="card pop" style="background:var(--coral)">☕ Java</div><div class="big pop" style="--d:.5s;color:#e0483a">≠</div><div class="card pop" style="--d:.3s;background:var(--yel)">✨ JavaScript</div></div>`],
[JS,'Naam similar hai, lekin dono alag languages hain. JavaScript ka naam us time Java ki popularity ka benefit lene ke liye rakha gaya tha.',8000,()=>`<div class="row"><div class="card pop" style="background:var(--coral)">☕ Java world</div><div class="card pop" style="--d:.5s;background:var(--yel)">🌐 JavaScript world</div></div><div class="big rise" style="--d:1s;font-size:clamp(24px,4vw,48px)">Similar names. Different languages.</div>`],
[JS,'JavaScript ki flexibility powerful hai, lekin bade projects mein code ko manage karna kabhi-kabhi difficult ho sakta hai.',7000,()=>`<div class="row">${['app.js','cart.js','user.js','api.js','utils.js','misc.js','old.js','new2.js'].map((f,i)=>`<div class="chip" style="position:static;background:var(--yel);--fx:${R(-400,400)}px;--fy:${R(-300,300)}px;--d:${i*.2}s;font-size:18px">${f}</div>`).join('')}</div><div class="sub rise" style="--d:2s">project grows… so does the tangle 🍝</div>`],
[JS,'Aur isi problem ko solve karne ke liye aayi...',4000,()=>`<div class="big pop" style="color:${TB}">…TypeScript</div>`],

let gx=200,gs=0,gl=0;
function cppGame(){
  setTimeout(gameInit,30);
  return `<canvas id="gc" width="480" height="300" style="background:#fff;border-radius:18px;box-shadow:0 10px 30px #0002;max-width:92%;touch-action:none"></canvas>
  <div class="row"><button class="btn l" onmousedown="gx=Math.max(20,gx-40)">◀</button><span id="gsc" class="sub">Score 0 — catch the ⭐ (move mouse / touch / buttons)</span><button class="btn l" onclick="gx=Math.min(460,gx+40)">▶</button></div>
  <div class="sub">Tiny 2D game in Canvas — educational demo of what C++ is used for, not a C++ program.</div>`;
}
function gameInit(){
  const c=document.getElementById('gc');if(!c||!c.getContext)return;
  const x=c.getContext('2d'),st=[];gs=0;let t=0;
  c.onmousemove=e=>{const r=c.getBoundingClientRect();gx=(e.clientX-r.left)*480/r.width};
  c.ontouchmove=e=>{const r=c.getBoundingClientRect();gx=(e.touches[0].clientX-r.left)*480/r.width};
  (function loop(){
    if(!document.body.contains(c))return;
    t++;if(t%40==0)st.push({x:R(20,460),y:0});
    x.clearRect(0,0,480,300);x.fillStyle=PU;x.fillRect(gx-30,270,60,14);
    x.font='24px serif';
    for(let k=st.length-1;k>=0;k--){const s=st[k];s.y+=2.5;x.fillText('⭐',s.x-12,s.y);
      if(s.y>262&&Math.abs(s.x-gx)<38){st.splice(k,1);gs++;const e=document.getElementById('gsc');if(e)e.textContent='Score '+gs}
      else if(s.y>300)st.splice(k,1)}
    requestAnimationFrame(loop)})();
}

  const s=document.getElementById('us');if(s)s.innerHTML=`&nbsp;transform.Translate(${dx},${dy});`}

/* ============ ENGINE ============ */
const $=id=>document.getElementById(id);
let i=0,auto=false,timer=null,paused=false;

function show(n){
  i=Math.max(0,Math.min(B.length-1,n));clearTimeout(timer);
  const b=B[i];$('scene').innerHTML=b[3]();$('strip').textContent=b[1];
  $('tag').textContent=b[0].toUpperCase()+' · BEAT '+(i+1)+'/'+B.length;
  $('stage').style.background=COL[b[0]]||'#fbf8f1';
  $('prog').style.width=((i+1)/B.length*100)+'%';
  if(auto&&!paused)timer=setTimeout(()=>{if(i<B.length-1)show(i+1)},b[2]);
}
const act={next:()=>show(i+1),prev:()=>show(i-1),replay:()=>show(i),
 play(){paused=!paused;if(!paused){auto=true;$('mode').textContent='Mode: Auto'}show(i)},
 mode(){auto=!auto;paused=false;$('mode').textContent='Mode: '+(auto?'Auto':'Manual');show(i)},
 sec(){const s=B[i][0];show(B.findIndex(b=>b[0]==s))},
 fs(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()},
 hide(){$('ctl').classList.toggle('h')},
 exit(){clearTimeout(timer);$('pres').style.display='none';$('home').style.display='flex';if(document.fullscreenElement)document.exitFullscreen()}};
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act[b.dataset.a]());
$('go').onclick=()=>{$('home').style.display='none';$('pres').style.display='flex';show(0)};
$('hcount').textContent=B.length+' sentence-level beats ready · Manual mode is default';
addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA'].includes(e.target.tagName)||$('pres').style.display!=='flex')return;
  const k=e.key.toLowerCase();
  if(k==='arrowright')act.next();else if(k==='arrowleft')act.prev();
  else if(k===' '){e.preventDefault();paused=!paused;show(i)}
  else if(k==='r')act.replay();else if(k==='f')act.fs();else if(k==='h')act.hide();
});

(()=>{const ctl=$('ctl'),sb=document.createElement('div');
 sb.style.cssText='display:none;position:fixed;inset:5% 8%;background:#fff;border-radius:20px;box-shadow:0 20px 60px #0005;padding:20px;overflow:auto;z-index:9;font:14px system-ui';
 document.body.appendChild(sb);
 const mk=(t,f)=>{const b=document.createElement('button');b.className='btn l';b.textContent=t;b.onclick=f;ctl.insertBefore(b,ctl.firstChild);return b};
 const secs=[...new Set(B.map(b=>b[0]))];
 const go=d=>{const c=secs.indexOf(B[i][0]),t=secs[Math.max(0,Math.min(secs.length-1,c+d))];show(B.findIndex(b=>b[0]==t))};
 mk('Section ⏭',()=>go(1));mk('⏮ Section',()=>go(-1));
 mk('Restart video',()=>show(0));
 mk('Storyboard',()=>{sb.style.display=sb.style.display=='none'?'block':'none';if(sb.style.display=='block')draw()});
 function draw(){sb.innerHTML='<b>Storyboard</b> — click any beat <button class="btn" onclick="this.parentNode.style.display=\'none\'">Close</button>'+
  secs.map(s=>`<h4 style="margin:14px 0 6px">${s}</h4>`+B.map((b,n)=>b[0]==s?`<button class="btn l" style="margin:2px;${n==i?'outline:2px solid #7c6cf0':''}" title="${b[1].replace(/"/g,'')}" onclick="show(${n});this.parentNode.style.display='none'">${n+1}</button>`:'').join('')).join('')}
})();
